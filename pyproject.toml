[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-rag-chatbot"
version = "0.1.0"
description = "Laptop-runnable offline multilingual RAG chatbot. LangChain + Qdrant (hybrid dense + BM25) + Ollama + FastAPI."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  # LangChain core + integrations
  "langchain>=0.3.0,<0.4",
  "langchain-community>=0.3.0,<0.4",
  "langchain-qdrant>=0.2,<0.3",
  "langchain-huggingface>=0.1,<0.3",
  "langchain-ollama>=0.2,<0.4",

  # Vector store — Qdrant (embedded or server); fastembed provides the BM25 sparse encoder
  "qdrant-client[fastembed]>=1.12,<2",

  # Embeddings
  "sentence-transformers>=3.0.0,<6",

  # Document loaders
  "pypdf>=4.0.0,<6",
  "unstructured[md]>=0.15.0,<0.17",

  # API
  "fastapi>=0.115.0,<0.120",
  "uvicorn[standard]>=0.30.0,<0.35",

  # Config / schemas
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",

  # Misc
  "pyyaml>=6.0,<7",
  "reportlab>=4.0,<5",
  "langdetect>=1.0.9,<2.0",

  # Tests
  "pytest>=8.0,<9",
  "pytest-mock>=3.12,<4",
  "httpx>=0.27,<0.29",

  # Evaluation
  "ragas>=0.2.0,<0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "eval*", "scripts*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_llm: tests that require a running Ollama instance",
]
